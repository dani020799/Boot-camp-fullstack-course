<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisdom App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Share Your Wisdom</h1>

        </div>

        <div id="wisdomList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
